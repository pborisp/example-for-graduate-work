# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
# !!! SECURITY WARNING: Never commit real passwords to version control !!!
# ??????????? ?????????? ????????? ? production:
# export DB_PASSWORD=your_secure_password_here

# Database connection URL
# ??????: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/market

# Database credentials
# DEV ONLY - replace with environment variables in production
spring.datasource.username=adminStar
spring.datasource.password=test

# Hibernate/JPA settings
# ddl-auto options:
#   - none:     ?? ???????? ????? ??
#   - validate: ????????? ?????, ?? ?? ????????
#   - update:   ???????? ????? (????????? ????? ???????/???????)
#   - create:   ??????? ?????? ??? ?????? ??????? (DEV ONLY!)
#   - create-drop: ??????? ??? ???????, ??????? ??? ????????? (TEST ONLY!)
# 
# WARNING: 'update' can cause data loss in production!
# Use Liquibase/Flyway for production schema management
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in logs (useful for debugging)
spring.jpa.show-sql=true

# Format SQL queries for better readability in logs
spring.jpa.properties.hibernate.format_sql=true


# ===================================================================
# LIQUIBASE DATABASE MIGRATIONS
# ===================================================================
# Liquibase changelog location
# ?????????? ?????????? ?? ????? YAML ?????
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml


# ===================================================================
# API DOCUMENTATION (SpringDoc OpenAPI / Swagger)
# ===================================================================
# OpenAPI 3.0 documentation endpoint
# ???????? ??: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

# Swagger UI interface endpoint
# ???????? ??: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html


# ===================================================================
# FILE UPLOAD CONFIGURATION
# ===================================================================
# Directory for storing uploaded files (relative to application root)
# ?????????, ??? ? ?????????? ???? ????? ?? ?????? ? ??? ??????????
file.upload.dir=./uploads

# Maximum size of single uploaded file
spring.servlet.multipart.max-file-size=10MB

# Maximum size of entire multipart request
spring.servlet.multipart.max-request-size=10MB

# Enable multipart file upload support
spring.servlet.multipart.enabled=true

# Resolve multipart files lazily at the point of injection
# Improves performance by not parsing files until needed
spring.servlet.multipart.resolve-lazily=true


# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
# Debug logging for application services
# ??????? ??? ??????? ??????-??????
Logging.level.ru.hogwarts.school.service=debug

# Debug logging for Spring Web MVC
# ?????????? ?????? HTTP ????????/???????
logging.level.org.springframework.web=DEBUG

# Debug logging for your application packages
# ???????? com.yourpackage ?? ??? ???????? package
logging.level.com.yourpackage=DEBUG


# ===================================================================
# SPRING BOOT ACTUATOR (Monitoring & Management)
# ===================================================================
# Expose all actuator endpoints (health, metrics, info, etc.)
# ? production ??????????: health, info, metrics
management.endpoints.web.exposure.include=*


# ===================================================================
# CACHE CONTROL FOR DEVELOPMENT
# ===================================================================
# Disable caching for static resources during development
# ??????? ??????????? ??????????? ?????? (??? ??????????)
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true